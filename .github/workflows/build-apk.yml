name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          unzip -q Ethiopia_Events_Android_Starter_v3.zip
          test -f ethio-events-android/settings.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/ethio-events-android" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

          rm -rf "$ANDROID_HOME/platforms/android-37"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: events-debug-apk
          path: ethio-events-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
