name: Build Tiqet Android V6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Tiqet_Android_V6.zip'
      - '.github/workflows/build-tiqet-v6.yml'
      - 'tiqet-android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Extract Tiqet V6 project
        shell: bash
        run: |
          unzip -q Tiqet_Android_V6.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/tiqet-android/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/tiqet-android/app/src/main/java/et/events/mobile/MainActivity.kt"
          test -f "$GITHUB_WORKSPACE/tiqet-android/supabase/migrations/001_tiqet_core.sql"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/tiqet-android" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 37 SDK and build tools
        shell: bash
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Supabase configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is missing. The APK will compile, but sign-in and server-backed features will be unavailable until repository variables are configured."
          else
            echo "Supabase URL and public client key found."
          fi

      - name: Build Tiqet debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload Tiqet debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v6-debug-apk
          path: tiqet-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Supabase backend files
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v6-supabase-backend
          path: |
            tiqet-android/supabase/migrations/001_tiqet_core.sql
            tiqet-android/supabase/functions/**
            tiqet-android/supabase/config.toml
          if-no-files-found: error
