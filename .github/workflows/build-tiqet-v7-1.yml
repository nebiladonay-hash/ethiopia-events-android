name: Build Tiqet Android V7.2

on:
  workflow_dispatch:
  push:
    branches:
      - v7.1-integration
    paths:
      - 'Tiqet_Android_V7_1.zip'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'patches/v7-2-payment-methods-api.patch'
      - 'patches/v7-2-minimal-ui.patch.gz.b64'
      - 'patches/v7-2-wave-ui.patch.gz.b64'
      - 'patches/v7-2-wave-finish.patch.gz.b64'
      - 'patches/v7-2-launcher-scale-only.patch.gz.b64'
      - '.github/workflows/build-tiqet-v7-1.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile V7.2 debug APK and package backend source
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://ebrrdmxyoioefoprtict.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVicnJkbXh5b2lvZWZvcHJ0aWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMzA2NzMsImV4cCI6MjEwOTYwNjY3M30.Av8tI5byGaTVSkePdt6BsU4qdfXXij2f8Tg9vUbWfNo"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract V7.2 Android source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Tiqet_Android_V7_1.zip
          unzip -q Tiqet_Android_V7_1.zip -d "$RUNNER_TEMP/tiqet-v7"
          PROJECT_DIR="$RUNNER_TEMP/tiqet-v7/tiqet-android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          test -f "$PROJECT_DIR/supabase/config.toml"
          test -f "$PROJECT_DIR/supabase/migrations/005_provider_agnostic_payment_core.sql"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Overlay committed production migration source
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          cp -R supabase/migrations/. "$PROJECT_DIR/supabase/migrations/"
          for migration in \
            20261108131058_harden_public_rpc_execute_grants.sql \
            20261108133704_index_uncovered_foreign_keys.sql \
            20261108133821_optimize_rls_auth_function_calls.sql \
            20261108133852_merge_overlapping_public_read_policies.sql \
            20261108134159_split_anon_public_read_rls_policies.sql \
            20261108141944_lock_down_webhook_event_table_grants.sql; do
            test -s "$PROJECT_DIR/supabase/migrations/$migration"
          done
          test ! -e "$PROJECT_DIR/supabase/migrations/20261108133955_split_anon_public_read_rls_policies.sql"
          echo "All committed production migrations overlaid with history-aligned filenames."

      - name: Apply reviewed Android payment-method API patch
        shell: bash
        run: |
          set -euo pipefail
          patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch < "$GITHUB_WORKSPACE/patches/v7-2-payment-methods-api.patch"
          grep -q 'fun fetchChapaPaymentMethods' "$PROJECT_DIR/app/src/main/java/et/events/mobile/backend/TiqetApi.kt"
          echo "Payment-method API patch applied."

      - name: Apply approved minimalist Tiqet branding and full UI refresh
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-minimal-ui.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          # Vector launcher resources replace the old raster icons, preventing Android from selecting stale density-specific bitmaps.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "$PROJECT_DIR/app/src/main/res/mipmap-$density/ic_launcher.png"
            rm -f "$PROJECT_DIR/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          test -s "$PROJECT_DIR/app/src/main/res/mipmap-anydpi/ic_launcher.xml"
          test -s "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'TiqetLogoLockup' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          grep -q 'Discover. Connect. Enjoy.' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          grep -q 'fun TiqetBrandMark' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'PAYMENT METHOD' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          echo "Tiqet V7.2 minimalist logo lockup, vector launcher mark, and refreshed app UI applied."

      - name: Apply Tiqet red wave visual system and adaptive icon spacing
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-wave-ui.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          grep -q 'fun TiqetWaveHeader' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'TiqetWaveHeader' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetAuthScreen.kt"
          grep -q 'android:scaleX="0.82"' "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher_foreground.xml"
          echo "Full-width red wave headers and the smaller adaptive launcher mark are in place."

      - name: Apply final Tiqet palette, zigzag ribbon and event header
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-wave-finish.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          grep -q 'val zigzag = Path()' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'title = event.title' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          echo "Tiqet red zigzag identity, warm ivory screens and event detail wave header applied."

      - name: Preserve existing Tiqet launcher artwork and shrink it only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["PROJECT_DIR"])
          targets = [
              root / "app/src/main/res/drawable/ic_launcher_foreground.xml",
              root / "app/src/main/res/drawable/ic_launcher_monochrome.xml",
              root / "app/src/main/res/mipmap-anydpi/ic_launcher.xml",
              root / "app/src/main/res/mipmap-anydpi/ic_launcher_round.xml",
          ]
          for p in targets:
              if not p.is_file():
                  raise SystemExit(f"Missing launcher vector: {p}")
              original = p.read_text()
              match = re.search(r'<group\\b[^>]*>', original)
              if not match:
                  raise SystemExit(f"No artwork group found in {p}")
              tag = match.group(0)
              tag2, nx = re.subn(r'android:scaleX="[^"]+"', 'android:scaleX="0.72"', tag, count=1)
              tag3, ny = re.subn(r'android:scaleY="[^"]+"', 'android:scaleY="0.72"', tag2, count=1)
              if nx != 1 or ny != 1:
                  raise SystemExit(f"Expected existing scale attributes in {p}; refusing to redraw artwork.")
              updated = original[:match.start()] + tag3 + original[match.end():]
              p.write_text(updated)
              # Assert that geometry, fills, ticket shape and background remain unchanged.
              assert p.read_text().count('android:scaleX="0.72"') == 1
              assert p.read_text().count('android:scaleY="0.72"') == 1
          print("Existing Tiqet launcher artwork, colours and backgrounds preserved; only vector-group scale set to 72%.")
          PY

      - name: Overlay canonical deployed Edge Function source
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/functions
          mkdir -p "$PROJECT_DIR/supabase/functions"
          cp -R supabase/functions/. "$PROJECT_DIR/supabase/functions/"
          for function in \
            create-chapa-checkout chapa-webhook chapa-payment-methods \
            chapa-payout-banks create-chapa-organizer-subaccount \
            create-platform-payout platform-revenue-summary \
            create-payment-intent payment-provider-catalog; do
            test -s "$PROJECT_DIR/supabase/functions/$function/index.ts"
          done
          test -s "$PROJECT_DIR/supabase/functions/_shared/provider-catalog.ts"
          test -s "$PROJECT_DIR/supabase/functions/_shared/payment-provider.ts"
          echo "Canonical backend function sources overlaid from the reviewed repository files."

      - name: Package prepared Android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tiqet-v7"
          zip -qr "$RUNNER_TEMP/tiqet-v7-2-android-source.zip" tiqet-android
          test -s "$RUNNER_TEMP/tiqet-v7-2-android-source.zip"

      - name: Upload prepared Android source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-android-source
          path: ${{ runner.temp }}/tiqet-v7-2-android-source.zip
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 37.0 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify TIqet public client configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = "https://ebrrdmxyoioefoprtict.supabase.co"
          test -n "$SUPABASE_ANON_KEY"
          echo "Android build targets TIqet-production with its public anon key."

      - name: Assemble debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload canonical Supabase backend source
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-supabase-backend
          path: |
            ${{ env.PROJECT_DIR }}/supabase/migrations/**
            ${{ env.PROJECT_DIR }}/supabase/functions/**
            ${{ env.PROJECT_DIR }}/supabase/config.toml
            ${{ env.PROJECT_DIR }}/V7_2_PAYMENT_CORE_CHANGELOG.md
          if-no-files-found: error
