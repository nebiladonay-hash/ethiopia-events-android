name: Build Tiqet Android V7.2

on:
  workflow_dispatch:
  push:
    branches:
      - v7.1-integration
      - tiqet-spotlight-discovery
    paths:
      - 'Tiqet_Android_V7_1.zip'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'patches/v7-2-payment-methods-api.patch'
      - 'scripts/apply-tiqet-spotlight.py'
      - 'scripts/add-organizer-category-shortcuts.py'
      - 'scripts/remove-platform-revenue-from-organizer.py'
      - 'scripts/fix-tiqet-wave-header-layout.py'
      - 'scripts/simplify-tiqet-event-creation.py'
      - 'scripts/harden-tiqet-network-errors.py'
      - 'scripts/fix-tiqet-startup-and-minimal-ui.py'
      - 'supabase/migrations/20261111103000_tiqet_spotlight_events.sql'
      - 'supabase/migrations/20261111110000_tiqet_organizer_event_banners.sql'
      - 'supabase/tests/tiqet_spotlight_*'
      - '.github/workflows/test-tiqet-spotlight.yml'
      - 'patches/v7-2-minimal-ui.patch.gz.b64'
      - 'patches/v7-2-wave-ui.patch.gz.b64'
      - 'patches/v7-2-wave-finish.patch.gz.b64'
      - 'patches/v7-2-launcher-scale-only.patch.gz.b64'
      - '.github/workflows/build-tiqet-v7-1.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile V7.2 debug APK and package backend source
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://ebrrdmxyoioefoprtict.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVicnJkbXh5b2lvZWZvcHJ0aWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMzA2NzMsImV4cCI6MjEwOTYwNjY3M30.Av8tI5byGaTVSkePdt6BsU4qdfXXij2f8Tg9vUbWfNo"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract V7.2 Android source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Tiqet_Android_V7_1.zip
          unzip -q Tiqet_Android_V7_1.zip -d "$RUNNER_TEMP/tiqet-v7"
          PROJECT_DIR="$RUNNER_TEMP/tiqet-v7/tiqet-android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          test -f "$PROJECT_DIR/supabase/config.toml"
          test -f "$PROJECT_DIR/supabase/migrations/005_provider_agnostic_payment_core.sql"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Overlay committed production migration source
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          cp -R supabase/migrations/. "$PROJECT_DIR/supabase/migrations/"
          for migration in \
            20261108131058_harden_public_rpc_execute_grants.sql \
            20261108133704_index_uncovered_foreign_keys.sql \
            20261108133821_optimize_rls_auth_function_calls.sql \
            20261108133852_merge_overlapping_public_read_policies.sql \
            20261108134159_split_anon_public_read_rls_policies.sql \
            20261108141944_lock_down_webhook_event_table_grants.sql; do
            test -s "$PROJECT_DIR/supabase/migrations/$migration"
          done
          test ! -e "$PROJECT_DIR/supabase/migrations/20261108133955_split_anon_public_read_rls_policies.sql"
          echo "All committed production migrations overlaid with history-aligned filenames."

      - name: Apply reviewed Android payment-method API patch
        shell: bash
        run: |
          set -euo pipefail
          patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch < "$GITHUB_WORKSPACE/patches/v7-2-payment-methods-api.patch"
          grep -q 'fun fetchChapaPaymentMethods' "$PROJECT_DIR/app/src/main/java/et/events/mobile/backend/TiqetApi.kt"
          echo "Payment-method API patch applied."

      - name: Apply approved minimalist Tiqet branding and full UI refresh
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-minimal-ui.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          # Vector launcher resources replace the old raster icons, preventing Android from selecting stale density-specific bitmaps.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "$PROJECT_DIR/app/src/main/res/mipmap-$density/ic_launcher.png"
            rm -f "$PROJECT_DIR/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          test -s "$PROJECT_DIR/app/src/main/res/mipmap-anydpi/ic_launcher.xml"
          test -s "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'TiqetLogoLockup' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          grep -q 'Discover. Connect. Enjoy.' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          grep -q 'fun TiqetBrandMark' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'PAYMENT METHOD' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          echo "Tiqet V7.2 minimalist logo lockup, vector launcher mark, and refreshed app UI applied."

      - name: Apply Tiqet red wave visual system and adaptive icon spacing
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-wave-ui.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          grep -q 'fun TiqetWaveHeader' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'TiqetWaveHeader' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetAuthScreen.kt"
          grep -q 'android:scaleX="0.82"' "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher_foreground.xml"
          echo "Full-width red wave headers and the smaller adaptive launcher mark are in place."

      - name: Apply final Tiqet palette, zigzag ribbon and event header
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/patches/v7-2-wave-finish.patch.gz.b64" \
            | gzip -dc \
            | patch -d "$RUNNER_TEMP/tiqet-v7" -p0 --forward --batch
          grep -q 'val zigzag = Path()' "$PROJECT_DIR/app/src/main/java/et/events/mobile/TiqetBrand.kt"
          grep -q 'title = event.title' "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          echo "Tiqet red zigzag identity, warm ivory screens and event detail wave header applied."

      - name: Restore the previous Tiqet launcher artwork and shrink only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])
          res = root / "app/src/main/res"
          scale = 'android:scaleX="0.72" android:scaleY="0.72"'

          foreground = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="54" android:rotation="-8" SCALE>
                  <path android:fillColor="#FAF8F4" android:pathData="M28,31 H80 Q87,31 87,38 V40 C77,45 77,57 87,62 V70 Q87,77 80,77 H28 Q21,77 21,70 V62 C31,57 31,45 21,40 V38 Q21,31 28,31 Z" />
                  <path android:fillColor="#76001F" android:pathData="M34,39 H74 V48 H59 V70 H49 V48 H34 Z" />
              </group>
          </vector>
          """.replace("SCALE", scale)

          background = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#72001C" android:pathData="M0,0h108v108h-108z" />
          </vector>
          """

          monochrome = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="54" android:rotation="-8" SCALE>
                  <path android:fillColor="#FFFFFFFF" android:pathData="M28,31 H80 Q87,31 87,38 V40 C77,45 77,57 87,62 V70 Q87,77 80,77 H28 Q21,77 21,70 V62 C31,57 31,45 21,40 V38 Q21,31 28,31 Z" />
                  <path android:fillColor="#FF000000" android:pathData="M34,39 H74 V48 H59 V70 H49 V48 H34 Z" />
              </group>
          </vector>
          """.replace("SCALE", scale)

          legacy = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#72001C" android:pathData="M0,0h108v108h-108z" />
              <group android:pivotX="54" android:pivotY="54" android:rotation="-8" SCALE>
                  <path android:fillColor="#FAF8F4" android:pathData="M28,31 H80 Q87,31 87,38 V40 C77,45 77,57 87,62 V70 Q87,77 80,77 H28 Q21,77 21,70 V62 C31,57 31,45 21,40 V38 Q21,31 28,31 Z" />
                  <path android:fillColor="#76001F" android:pathData="M34,39 H74 V48 H59 V70 H49 V48 H34 Z" />
              </group>
          </vector>
          """.replace("SCALE", scale)

          files = {
              "drawable/ic_launcher_foreground.xml": foreground,
              "drawable/ic_launcher_background.xml": background,
              "drawable/ic_launcher_monochrome.xml": monochrome,
              "mipmap-anydpi/ic_launcher.xml": legacy,
              "mipmap-anydpi/ic_launcher_round.xml": legacy,
          }
          for relative, content in files.items():
              target = res / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          # Adaptive resources continue to reference these exact layers; do not redraw them.
          for relative in ("mipmap-anydpi-v26/ic_launcher.xml", "mipmap-anydpi-v26/ic_launcher_round.xml"):
              target = res / relative
              if not target.is_file():
                  raise SystemExit(f"Missing adaptive icon declaration: {target}")
              data = target.read_text()
              if '@drawable/ic_launcher_foreground' not in data or '@drawable/ic_launcher_background' not in data:
                  raise SystemExit(f"Unexpected adaptive icon references in {target}")

          # Guard the previous ticket/T geometry, brand colours, solid background and exact 72% scale.
          fg = (res / "drawable/ic_launcher_foreground.xml").read_text()
          assert 'M34,39 H74 V48 H59 V70 H49 V48 H34 Z' in fg
          assert '#FAF8F4' in fg and '#76001F' in fg
          assert 'android:rotation="-8" android:scaleX="0.72" android:scaleY="0.72"' in fg
          assert '#72001C' in (res / "drawable/ic_launcher_background.xml").read_text()
          print("Exact previous cream-ticket/burgundy-T launcher restored; only artwork scale reduced to 72%.")
          PY

      - name: Apply Spotlight, Boxing Matches and organizer-owned banner UI
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-tiqet-spotlight.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/add-organizer-category-shortcuts.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/remove-platform-revenue-from-organizer.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/fix-tiqet-wave-header-layout.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/simplify-tiqet-event-creation.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/harden-tiqet-network-errors.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/fix-tiqet-startup-and-minimal-ui.py" "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          root = Path(__import__("os").environ["PROJECT_DIR"]) / "app/src/main/java/et/events/mobile"
          main = (root / "MainActivity.kt").read_text()
          api = (root / "backend/TiqetApi.kt").read_text()
          org = (root / "TiqetOrganizerScreen.kt").read_text()
          auth = (root / "TiqetAuthScreen.kt").read_text()
          checks = {
              "event publishing action": ("Publish event now" in org),
              "ticket tier creation API": ("create_event_with_ticket_options" in api),
              "automatic event banner fitting": ("fitTiqetEventBanner" in api),
              "no legacy event approval filter": ("approval_status=eq.approved" not in api),
              "public events use anon client": ('val rows = requestArray("GET", "/rest/v1/events?$query", useSession = false)' in api),
              "removed auto-publish RPC": ("set_organiser_auto_publish" not in api and "set_organiser_auto_publish" not in org),
              "VVIP ticket option": ("VVIP" in org),
              "platform revenue removed from organiser": ("TIQET PLATFORM REVENUE" not in org and "fetchPlatformRevenueSummary" not in org and "withdrawPlatformRevenue" not in org),
              "wave header retained on auth": ("TiqetWaveHeader" in auth),
              "auth body gutter retained": ("padding(horizontal = 24.dp, vertical = 20.dp)" in auth),
              "organiser body gutter retained": ("padding(horizontal = 21.dp)" in org),
              "auth form centered": ("verticalArrangement = Arrangement.Center" in auth),
              "no event approval copy": ("Publishing requires verification" not in auth),
              "Boxing Matches category": ("Boxing Matches" in main),
              "Spotlight feed": ("Tiqet Spotlight" in main and "fetchSpotlightEvents" in api),
              "customer-safe error mapping": ("userFacingError" in api),
              "bounded auth retry": ("retryAuth = false" in api),
              "classic buyer entry card": ("I'm here to discover and book events." in main),
              "ticket card mark": ("TicketMark(color = foreground" in main),
              "no unwanted generic splash": ("Make room for good plans." not in main),
              "Discover retry": ("onRetry" in main),
              "classic text navigation": ("private fun BottomBar" in main and __import__("re").search(r"Text\\(\\s*item\\s*,", main) is not None and "Icons.Outlined.Explore" not in main),
              "organiser-owned banner upload": ("uploadEventBanner" in api and "set_organiser_event_banner" in api),
          }
          failed = []
          for label, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + label)
              if not ok:
                  failed.append(label)
          if failed:
              raise SystemExit("UI source assertions failed: " + ", ".join(failed))
          print("All Tiqet V7.2 UI and API source assertions passed.")
          PY
      - name: Overlay canonical deployed Edge Function source
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/functions
          mkdir -p "$PROJECT_DIR/supabase/functions"
          cp -R supabase/functions/. "$PROJECT_DIR/supabase/functions/"
          for function in \
            create-chapa-checkout chapa-webhook chapa-payment-methods \
            chapa-payout-banks create-chapa-organizer-subaccount \
            create-platform-payout platform-revenue-summary \
            create-payment-intent payment-provider-catalog; do
            test -s "$PROJECT_DIR/supabase/functions/$function/index.ts"
          done
          test -s "$PROJECT_DIR/supabase/functions/_shared/provider-catalog.ts"
          test -s "$PROJECT_DIR/supabase/functions/_shared/payment-provider.ts"
          echo "Canonical backend function sources overlaid from the reviewed repository files."

      - name: Package prepared Android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tiqet-v7"
          zip -qr "$RUNNER_TEMP/tiqet-v7-2-android-source.zip" tiqet-android
          test -s "$RUNNER_TEMP/tiqet-v7-2-android-source.zip"

      - name: Upload prepared Android source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-android-source
          path: ${{ runner.temp }}/tiqet-v7-2-android-source.zip
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 37.0 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify TIqet public client configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = "https://ebrrdmxyoioefoprtict.supabase.co"
          test -n "$SUPABASE_ANON_KEY"
          echo "Android build targets TIqet-production with its public anon key."

      - name: Assemble debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug


      - name: Smoke-test customer app launch and authentication screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop et.events.mobile || true
            adb shell am start -W -n et.events.mobile/.MainActivity
            sleep 3
            adb shell pidof et.events.mobile >/dev/null
            adb shell uiautomator dump /sdcard/tiqet-entry.xml >/dev/null
            adb shell cat /sdcard/tiqet-entry.xml > "$RUNNER_TEMP/tiqet-entry.xml"
            ENTRY_BOUNDS="$(python3 - "$RUNNER_TEMP/tiqet-entry.xml" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            for node in root.iter("node"):
                if "discover and book events" in node.attrib.get("text", ""):
                    match = re.search(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                    if match:
                        left, top, right, bottom = map(int, match.groups())
                        print((left + right) // 2, (top + bottom) // 2)
                        raise SystemExit(0)
            raise SystemExit("Tiqet buyer-entry option was not present in the first screen.")
            PY
            )"
            read -r ENTRY_X ENTRY_Y <<< "$ENTRY_BOUNDS"
            adb shell input tap "$ENTRY_X" "$ENTRY_Y"
            sleep 2
            adb shell pidof et.events.mobile >/dev/null
            adb shell uiautomator dump /sdcard/tiqet-auth.xml >/dev/null
            adb shell cat /sdcard/tiqet-auth.xml > "$RUNNER_TEMP/tiqet-auth.xml"
            python3 - "$RUNNER_TEMP/tiqet-auth.xml" <<'PY'
            import sys, xml.etree.ElementTree as ET
            texts = [node.attrib.get("text", "") for node in ET.parse(sys.argv[1]).getroot().iter("node")]
            if not any("Welcome back" in value for value in texts):
                raise SystemExit("Tiqet did not reach the login screen after selecting buyer.")
            if not any("Create an account" in value for value in texts):
                raise SystemExit("Tiqet signup action was not rendered on the login screen.")
            PY
            CREATE_BOUNDS="$(python3 - "$RUNNER_TEMP/tiqet-auth.xml" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            for node in root.iter("node"):
                value = node.attrib.get("text", "")
                if "New to Tiqet?" in value and "Create an account" in value:
                    match = re.search(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                    if match:
                        left, top, right, bottom = map(int, match.groups())
                        print((left + right) // 2, (top + bottom) // 2)
                        raise SystemExit(0)
            raise SystemExit("Could not locate the signup toggle.")
            PY
            )"
            read -r CREATE_X CREATE_Y <<< "$CREATE_BOUNDS"
            adb shell input tap "$CREATE_X" "$CREATE_Y"
            sleep 2
            adb shell pidof et.events.mobile >/dev/null
            adb shell uiautomator dump /sdcard/tiqet-signup.xml >/dev/null
            adb shell cat /sdcard/tiqet-signup.xml > "$RUNNER_TEMP/tiqet-signup.xml"
            python3 - "$RUNNER_TEMP/tiqet-signup.xml" <<'PY'
            import sys, xml.etree.ElementTree as ET
            texts = [node.attrib.get("text", "") for node in ET.parse(sys.argv[1]).getroot().iter("node")]
            if not any("Create your account" in value for value in texts):
                raise SystemExit("Tiqet did not render the signup screen.")
            PY
            adb shell screencap -p /sdcard/tiqet-signup.png
            adb pull /sdcard/tiqet-signup.png "$RUNNER_TEMP/tiqet-signup.png"
            if adb logcat -d -t 5000 | grep -F -e "FATAL EXCEPTION" -e "Process: et.events.mobile"; then
              echo "Android runtime crash detected during launch/auth navigation."
              exit 1
            fi
            echo "Tiqet launched, opened login, and opened signup without a fatal runtime exception."

      - name: Upload emulator signup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-classic-wave-emulator-proof
          path: ${{ runner.temp }}/tiqet-signup.png
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload canonical Supabase backend source
        uses: actions/upload-artifact@v4
        with:
          name: tiqet-v7-2-supabase-backend
          path: |
            ${{ env.PROJECT_DIR }}/supabase/migrations/**
            ${{ env.PROJECT_DIR }}/supabase/functions/**
            ${{ env.PROJECT_DIR }}/supabase/config.toml
            ${{ env.PROJECT_DIR }}/V7_2_PAYMENT_CORE_CHANGELOG.md
          if-no-files-found: error
