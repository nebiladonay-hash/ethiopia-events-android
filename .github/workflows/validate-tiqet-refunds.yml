name: Validate TIQET Chapa refund backend

on:
  push:
    branches:
      - tiqet-refund-backend-v1
    paths:
      - 'supabase/functions/create-chapa-refund/**'
      - 'supabase/functions/verify-chapa-refund/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-tiqet-refunds.yml'
  pull_request:
    branches:
      - v7.1-integration
      - tiqet-control-refunds
    paths:
      - 'supabase/functions/create-chapa-refund/**'
      - 'supabase/functions/verify-chapa-refund/**'
      - 'supabase/migrations/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check refund creation function
        run: deno check supabase/functions/create-chapa-refund/index.ts
      - name: Check refund verification function
        run: deno check supabase/functions/verify-chapa-refund/index.ts
      - name: Check migration safety markers
        shell: bash
        run: |
          test -s supabase/migrations/20261110120000_chapa_refund_operations.sql
          grep -q 'prepare_chapa_refund' supabase/migrations/20261110120000_chapa_refund_operations.sql
          grep -q 'record_chapa_refund_result' supabase/migrations/20261110120000_chapa_refund_operations.sql
          grep -q 'get_tiqet_refunds_dashboard' supabase/migrations/20261110120000_chapa_refund_operations.sql
