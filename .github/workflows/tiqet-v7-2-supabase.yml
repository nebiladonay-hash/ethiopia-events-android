name: Tiqet V7.2 Backend Package Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source package without changing production
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tiqet source
        uses: actions/checkout@v4
        with:
          ref: v7.1-integration

      - name: Verify Tiqet Android and Supabase source
        shell: bash
        run: |
          set -euo pipefail
          test -f Tiqet_Android_V7_1.zip
          unzip -q Tiqet_Android_V7_1.zip -d "$RUNNER_TEMP/tiqet-v7"
          PROJECT_DIR="$RUNNER_TEMP/tiqet-v7/tiqet-android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/et/events/mobile/MainActivity.kt"
          test -f "$PROJECT_DIR/supabase/config.toml"
          test -f "$PROJECT_DIR/supabase/migrations/005_provider_agnostic_payment_core.sql"
          for function in             create-chapa-checkout chapa-webhook chapa-payment-methods             chapa-payout-banks create-chapa-organizer-subaccount             create-platform-payout platform-revenue-summary             create-payment-intent payment-provider-catalog; do
            test -f "supabase/functions/$function/index.ts"
          done
          echo "Package verification passed."
          echo "This workflow does not apply migrations, deploy functions, or alter production."

