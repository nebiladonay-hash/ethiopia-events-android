name: Tiqet V7.2 Supabase Backend

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Start with audit. Choose deploy only after reviewing the dry-run output."
        required: true
        type: choice
        default: audit
        options:
          - audit
          - deploy

permissions:
  contents: read

jobs:
  supabase:
    name: Audit or deploy Tiqet V7.2 backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ebrrdmxyoioefoprtict

    steps:
      - name: Check out Tiqet source
        uses: actions/checkout@v4

      - name: Verify credentials and source archive
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Add SUPABASE_DB_PASSWORD in GitHub Actions secrets."; exit 1; }
          test -f Tiqet_Android_V7_1.zip
          unzip -q Tiqet_Android_V7_1.zip -d "$RUNNER_TEMP/tiqet-v7"
          PROJECT_DIR="$RUNNER_TEMP/tiqet-v7/tiqet-android"
          test -f "$PROJECT_DIR/supabase/config.toml"
          test -f "$PROJECT_DIR/supabase/migrations/005_provider_agnostic_payment_core.sql"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the intended Supabase project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show remote migration status
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          supabase migration list --remote
          echo
          echo "Dry-run only: this step does not change the database."
          supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          supabase db push --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Deploy Tiqet Edge Functions
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for function in             create-chapa-checkout             chapa-webhook             chapa-payment-methods             chapa-payout-banks             create-chapa-organizer-subaccount             create-platform-payout             platform-revenue-summary             create-payment-intent             payment-provider-catalog; do
            echo "Deploying $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --yes
          done

      - name: Deployment summary
        if: ${{ inputs.mode == 'deploy' }}
        run: echo "Pending migrations were applied and the Tiqet V7.2 Edge Functions were deployed. Confirm required Chapa secrets and test in sandbox before live use."
